  <circle cx="370" cy="435" r="28" fill="#151515"/>
  <g stroke="#151515" stroke-width="3">
    <line x1="428" y1="250" x2="828" y2="250"/>
    <line x1="428" y1="276" x2="694" y2="276"/>
    <line x1="428" y1="336" x2="820" y2="336"/>

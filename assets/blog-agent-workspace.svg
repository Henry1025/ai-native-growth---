<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent workspace editorial illustration</title>
  <desc id="desc">A black and white editorial diagram of humans and AI agents working in shared channels.</desc>
  <rect width="960" height="600" fill="#f7f7f7"/>
  <rect x="34" y="34" width="892" height="532" fill="#fff" stroke="#151515" stroke-width="3"/>
  <line x1="34" y1="110" x2="926" y2="110" stroke="#151515" stroke-width="3"/>
  <text x="60" y="82" fill="#151515" font-family="Georgia, serif" font-size="38" font-weight="700">Agent Workspace</text>
  <g fill="none" stroke="#151515" stroke-width="2">
    <rect x="62" y="148" width="210" height="346"/>
    <rect x="310" y="148" width="588" height="346"/>
    <line x1="310" y1="220" x2="898" y2="220"/>
